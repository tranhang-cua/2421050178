<html lang="en">
  <head>
    <title>JavaScript</title>
  </head>
  <body>
    <!-- Internal JavsScript -->
    <script>
      // in ra màn hình
      document.writeln("Hello World <br>");

      // khai báo biến
      var ten = "Thu Hằng<br>";

      document.writeln(ten);

      ten = "Ngọc Huyền <br>";
      document.writeln(ten);

      var namNay = 2026;
      document.writeln(namNay);

      // Phép toán
      var soThuNhat = 10;
      var soThuHai = 5;
      var ketQua = 0;
      // cộng
      document.write("<br> Ket qua soThuNhat + soThuHai là:");
      ketQua = soThuNhat + soThuHai;
      document.write(ketQua);
      // trừ
      document.write("<br> Ket qua soThuNhat - soThuHai là:");
      ketQua = soThuNhat - soThuHai;
      document.write(ketQua);
      // nhân
      document.write("<br> Ket qua soThuNhat * soThuHai là:");
      ketQua = soThuNhat * soThuHai;
      document.write(ketQua);
      // chia
      document.write("<br> Ket qua soThuNhat / soThuHai là:");
      ketQua = soThuNhat / soThuHai;
      document.write(ketQua);
      // %
      document.write("<br> Ket qua soThuNhat %soThuHai là:");
      ketQua = soThuNhat % soThuHai;
      document.write(ketQua);

      // ++
      document.writeln("<br>");
      document.writeln(++soThuNhat);
      // --
      document.writeln("<br>");
      document.writeln(--soThuNhat);

      // +=
      soThuNhat += soThuHai;
      document.writeln(soThuNhat);

      // -=
      soThuNhat -= soThuHai;
      document.writeln(soThuNhat);

      var ho = "Trần";
      document.writeln("<br>" + ho + " " + ten);
      document.writeln("<br>");
      document.writeln(ho.length);

      // Kiểm tra kiểu dưc liệu của biến
      document.writeln(typeof ho);
      document.writeln("<br>");

      var hoVaTen = "Trần Thị Thu Hằng";
      document.writeln(hoVaTen.indexOf("Q"));
      document.writeln("<br>");
      document.writeln(hoVaTen.includes("e"));

      document.writeln("<br>");
      document.writeln(hoVaTen.startsWith("Trần"));
      document.write(hoVaTen.replace("Trần", "Nguyễn"));

      document.writeln("<br>");
      document.write(hoVaTen.toUpperCase());

      document.writeln("<br>");
      document.write(hoVaTen.toLocaleLowerCase());

      // date
      var homNay = new Date();
      document.writeln("<br>");
      document.write(homNay);

      var ngay = new Date("01/01/2026");
      document.writeln("<br>");
      document.write(ngay);

      var namNay = homNay.getFullYear();
      document.writeln("<br>");
      document.write(namNay);

      var thangNay = homNay.getMonth();
      document.writeln("<br>");
      document.write(thangNay);

      var ngayHomNay = homNay.getDate();
      document.writeln("<br>");
      document.write(ngayHomNay);

      var thu = homNay.getDay();
      document.writeln("<br>");
      document.write(thu);

      document.writeln(
        "<br>" +
          "Hon may la thu" +
          thu +
          "ngay" +
          ngay +
          "thang" +
          thangNay +
          "nam" +
          namNay,
      );

      // mảng
      var mangSo = [1, 2, 3, 4, 5];
      document.writeln("<br>");
      document.writeln(mangSo[2]);
      document.writeln("<br>");
      document.writeln(mangSo.length);

      document.writeln("<br>");
      var mangTen = ["Ngọc Huyền", "Hằng", "Huy"];
      document.writeln(mangTen[2]);

      document.writeln("<br>");
      var mang = [1, 2, 3, 4, 5, "Ngọc Huyền", "Hằng", "Huy"];
      document.writeln(mang[5]);

      var d = mang.concat(mangSo, mangTen);
      document.writeln("<br>");
      document.write(d);

      // thêm dấu - vào giữa các kí tự
      var d = mang.concat(mangSo, mangTen);
      document.writeln("<br>");
      document.writeln(d.join("-"));

      // lấy phần tử cuối cùng trong mảng
      var d = mang.concat(mangSo, mangTen);
      document.writeln("<br>");
      document.writeln(d.pop());

      // thêm phần tử
      var d = mang.concat(mangSo, mangTen);
      d.push("Nhung");
      document.writeln(d);

      // đảo ngược mảng
      document.writeln("<br>");
      document.writeln(mangSo.reverse());

      // objiect
      var thongTinSinhVien = {
        ten: "Trần Thị Thu Hăng",
        namsinh: 2006,
        quequan: {
          tinh: "Nam Dinh",
          xa: "Nghia Lam",
        },
      };
      document.write(thongTinSinhVien.quequan.tinh);
      tuoi = namNay - thongTinSinhVien.namsinh;
      thongTinSinhVien.tuoi;
      document.writeln(tuoi);

      // == !=
      var so1 = 10;
      var so2 = "10";
      document.writeln("<br>");
      document.writeln(so1 === so2);

      // && ||
      if (thu > 6) {
        document.writeln("cuoi tuan");
      } else {
        document.writeln("đi học");
      }

      // kiểm tra số chẵn lẻ
      var so = 5;
      // về timh hiểu sao khi var so=200000000001 thì lẠI HIỆN RA kết quả là số chẵn
      if (so % 2 == 0) {
        document.writeln(so + "là số chẵn");
      } else {
        document.writeln(so + "là số lẻ");
      }
    </script>
    <!-- External Javascript -->
    <script src="script.js"></script>
  </body>
</html>
