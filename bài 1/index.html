<html>
    <head>
        <title>bai 1 html</title>
    </head>
    <body>
        môn phát triển ứng dụng web + BTL
        
        <!-- để chú thích dùng 2 cách 
        cách 1:ctrl + k +c
        cách 2 :ctrl + /
        đây là chú thích -->

        <p>Thẻ p là thẻ phân đoạn</p>

        <!-- thẻ h là thẻ định dạng đề mục -->
        <h1>Thẻ H1</h1>
        <h2>Thẻ H2</h2>
        <h3>Thẻ H3</h3>
        <!-- thẻ br để xuống dòng -->

        <P>Môn web <br> nhóm 03</P>


        <!-- thẻ div vad span để chia đoạn -->
         <div>đây là thẻ div</div>
         <span>đây là thẻ span</span>

         <b>Thẻ b</b>
         <i>thẻ i</i>
         <u>thẻ u</u>
         <!-- thẻ b viết đậm 
         thẻ i viết nghiêng 
         thẻ u gạch chân -->

         <div>
            <font face="verdana">Môn phát triển ứng dụng web</font>
            <font color=" blue">Nhóm 03</font>
            <font size="10">tiết 1 2</font>

            <br><font face="Arial" color="green" size="15">Trần Thị Thu Hằng</font>
            
         </div>

    </body>
</html>
